
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบวิเคราะห์ภาพด้วย AI</title>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Tahoma, sans-serif;
            background: #f5f3fc;
            color: #292342;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 850px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(80, 60, 140, 0.12);
        }

        h1 {
            text-align: center;
            color: #7057d9;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #a99af5;
            border-radius: 15px;
            padding: 35px 20px;
            text-align: center;
            background: #faf9ff;
        }

        .upload-box p {
            color: #777;
        }

        input[type="file"] {
            display: none;
        }

        .upload-btn {
            display: inline-block;
            background: #7057d9;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
        }

        .upload-btn:hover {
            background: #5140ad;
        }

        .preview-section {
            text-align: center;
            margin-top: 25px;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            margin: 15px auto;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            margin: 8px;
        }

        #analyzeBtn {
            background: #7057d9;
            color: white;
        }

        #clearBtn {
            background: #eeeafa;
            color: #5140ad;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-section {
            margin-top: 30px;
            padding: 20px;
            background: #faf9ff;
            border-radius: 15px;
        }

        .result-section h2 {
            color: #7057d9;
            text-align: center;
        }

        .result-item {
            margin: 15px 0;
        }

        .result-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 7px;
        }

        .bar {
            height: 12px;
            background: #e7e3f3;
            border-radius: 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #8068df;
            border-radius: 10px;
        }

        #message {
            text-align: center;
            color: #777;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ระบบวิเคราะห์ภาพด้วย AI</h1>

    <p class="description">
        อัปโหลดรูปภาพเพื่อให้ระบบวิเคราะห์และจำแนกประเภทของภาพ
    </p>

    <!-- ส่วนอัปโหลดภาพ -->
    <div class="upload-box">

        <h3>นำเข้ารูปภาพ</h3>

        <p>เลือกรูปภาพจากอุปกรณ์ของคุณ จำนวน 1 รูป</p>

        <label for="imageInput" class="upload-btn">
            + อัปโหลดภาพ
        </label>

        <input
            type="file"
            id="imageInput"
            accept="image/*"
        >

    </div>

    <!-- แสดงภาพตัวอย่าง -->
    <div class="preview-section">

        <h3>ภาพที่เลือก</h3>

        <img id="preview" alt="ภาพตัวอย่าง">

        <br>

        <button id="analyzeBtn" disabled>
            วิเคราะห์ภาพ
        </button>

        <button id="clearBtn" disabled>
            ล้างภาพ
        </button>

    </div>

    <!-- แสดงผลการวิเคราะห์ -->
    <div class="result-section">

        <h2>ผลการวิเคราะห์</h2>

        <div id="label-container">
            <p style="text-align:center;color:#888;">
                ผลการวิเคราะห์จะแสดงที่นี่
            </p>
        </div>

    </div>

    <p id="message">กรุณาอัปโหลดรูปภาพ</p>

</div>

<script>

    // URL ของโมเดล Teachable Machine
    const URL = "https://teachablemachine.withgoogle.com/models/pfr7PNmqB/";

    let model;
    let selectedImage = null;

    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const clearBtn = document.getElementById("clearBtn");
    const labelContainer = document.getElementById("label-container");
    const message = document.getElementById("message");

    // โหลดโมเดล AI
    async function loadModel() {

        message.innerText = "กำลังโหลดโมเดล AI...";

        try {

            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmImage.load(modelURL, metadataURL);

            message.innerText = "พร้อมใช้งาน กรุณาอัปโหลดภาพ";

        } catch (error) {

            message.innerText = "ไม่สามารถโหลดโมเดลได้";
            console.error(error);

        }
    }

    // เลือกรูปภาพจากไฟล์
    imageInput.addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) return;

        if (!file.type.startsWith("image/")) {
            message.innerText = "กรุณาเลือกไฟล์รูปภาพ";
            return;
        }

        selectedImage = file;

        const reader = new FileReader();

        reader.onload = function(e) {

            preview.src = e.target.result;
            preview.style.display = "block";

            analyzeBtn.disabled = false;
            clearBtn.disabled = false;

            labelContainer.innerHTML =
                "<p style='text-align:center;'>กดปุ่มวิเคราะห์ภาพเพื่อแสดงผล</p>";

            message.innerText = "อัปโหลดภาพสำเร็จ";

        };

        reader.readAsDataURL(file);

    });

    // วิเคราะห์ภาพ
    analyzeBtn.addEventListener("click", async function() {

        if (!selectedImage) return;

        analyzeBtn.disabled = true;

        message.innerText = "กำลังวิเคราะห์ภาพ...";

        labelContainer.innerHTML =
            "<p style='text-align:center;'>กำลังประมวลผล...</p>";

        try {

            if (!model) {
                await loadModel();
            }

            // ส่งภาพเข้าสู่โมเดล AI
            const prediction = await model.predict(preview);

            // เรียงลำดับผลจากความเชื่อมั่นสูงสุด
            prediction.sort((a, b) =>
                b.probability - a.probability
            );

            // แสดงผลการวิเคราะห์
            labelContainer.innerHTML = "";

            prediction.forEach(item => {

                const percent = (item.probability * 100).toFixed(2);

                const result = document.createElement("div");

                result.className = "result-item";

                result.innerHTML = `
                    <div class="result-text">
                        <strong>${escapeHTML(item.className)}</strong>
                        <strong>${percent}%</strong>
                    </div>

                    <div class="bar">
                        <div class="bar-fill"
                             style="width:${percent}%">
                        </div>
                    </div>
                `;

                labelContainer.appendChild(result);

            });

            message.innerText =
                "วิเคราะห์ภาพเรียบร้อยแล้ว";

        } catch (error) {

            console.error(error);

            message.innerText =
                "เกิดข้อผิดพลาดในการวิเคราะห์ภาพ";

        }

        analyzeBtn.disabled = false;

    });

    // ป้องกันการแทรก HTML จากชื่อคลาส
    function escapeHTML(text) {
        return String(text).replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    // ล้างภาพและผลการวิเคราะห์
    clearBtn.addEventListener("click", function() {

        selectedImage = null;

        imageInput.value = "";

        preview.src = "";
        preview.style.display = "none";

        analyzeBtn.disabled = true;
        clearBtn.disabled = true;

        labelContainer.innerHTML =
            "<p style='text-align:center;color:#888;'>ผลการวิเคราะห์จะแสดงที่นี่</p>";

        message.innerText = "กรุณาอัปโหลดรูปภาพ";

    });

    // เริ่มต้นโหลดโมเดล
    loadModel();

</script>

</body>
</html>
